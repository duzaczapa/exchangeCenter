<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main page</title>
</head>
<body>
    <h1>Exchange rates (Table {{ .Table }})</h1>

    <table>
        <thead>
            <tr>
                <th>Currency</th>
                <th>Code</th>
                <th>Rate (PLN)</th>
            </tr>
        </thead>
        <tbody>
            {{ range .Rates }}
            <tr>
                <td>{{ .Currency }}</td>
                <td>{{ .Code }}</td>
                <td>{{ .Mid }}</td>
            </tr>
            {{ end }}
        </tbody>
    </table>
</body>
</html>
